<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPDESIGN | Affordable Custom Websites for UK Businesses</title>
    <meta
      name="description"
      content="Premium websites, landing pages, AI solutions and custom platforms for UK small businesses. Professional quality from £1,500. Get a free quote today."
    />
    <link rel="canonical" href="https://ipdesign.co.uk/" />
    <meta property="og:title" content="IPDESIGN | Affordable Custom Websites for UK Businesses" />
    <meta property="og:description" content="Premium websites, landing pages, AI solutions and custom platforms for UK small businesses. Professional quality from £1,500." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ipdesign.co.uk" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IPDESIGN | Affordable Custom Websites for UK Businesses" />
    <meta name="twitter:description" content="Premium websites, landing pages, AI solutions and custom platforms for UK small businesses." />
    <meta name="twitter:image" content="/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Lexend+Deca:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/logo4.svg" />
    <link rel="apple-touch-icon" href="/logo4.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "IPDESIGN",
      "url": "https://ipdesign.co.uk",
      "email": "hello@ipdesign.co.uk",
      "description": "Premium websites, AI solutions, custom platforms and digital services for UK businesses.",
      "foundingDate": "2024",
      "areaServed": "GB"
    }
    </script>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <!-- Header — outside smooth-wrapper, stays fixed -->
    <header class="site-header">
      <div class="container header__inner">
        <a class="brand" href="#top" aria-label="IPDESIGN Home">
          <img class="brand__logo" src="/logo4.svg" alt="IPDESIGN" />
        </a>
        <nav class="site-nav" id="site-nav" aria-label="Main navigation">
          <a href="#services" id="nav-services">Services</a>
          <a href="#why" id="nav-why">Why Us</a>
          <a href="#proof" id="nav-proof">Portfolio</a>
          <a href="#process" id="nav-process">Process</a>
        </nav>
        <div class="header__actions">
          <a class="button button--primary button--compact" href="#contact" id="header-cta">Get a Quote</a>
          <button class="lang-toggle" type="button" id="lang-toggle" aria-label="Switch language">FR</button>
          <button class="hamburger" type="button" id="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
            <span class="hamburger__line"></span>
            <span class="hamburger__line"></span>
            <span class="hamburger__line"></span>
          </button>
        </div>
      </div>
    </header>

    <!-- GSAP ScrollSmoother wrapper -->
    <div id="smooth-wrapper">
      <div id="smooth-content">
        <main id="main">
          <!-- Section 1 — Hero -->
          <section class="hero" id="top" data-reveal>
            <!-- Blue motion backdrop -->
            <div class="hero__backdrop" aria-hidden="true">
              <div class="hero__gradient hero__gradient--one"></div>
              <div class="hero__gradient hero__gradient--two"></div>
              <div class="hero__grid"></div>
            </div>
            <!-- Floating project thumbnails -->
            <div class="hero__floaters" aria-hidden="true">
              <img class="hero__float hero__float--1" src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=400&q=60" alt="" />
              <img class="hero__float hero__float--2" src="https://images.unsplash.com/photo-1555371363-72f1af3b1bc3?auto=format&fit=crop&w=400&q=60" alt="" />
              <img class="hero__float hero__float--3" src="https://images.unsplash.com/photo-1517832207067-4db24a2ae47c?auto=format&fit=crop&w=400&q=60" alt="" />
              <img class="hero__float hero__float--4" src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=400&q=60" alt="" />
            </div>
            <div class="hero__inner container">
              <p class="eyebrow" id="hero-eyebrow"></p>
              <h1 class="hero-title" id="hero-title"></h1>
              <p class="hero__lead" id="hero-lead"></p>
              <div class="hero-ctas">
                <a class="button button--primary" href="#contact" id="hero-primary-cta"></a>
                <a class="button button--ghost" href="#services" id="hero-ghost-cta"></a>
              </div>
              <div class="trust-bar" id="trust-bar"></div>
            </div>
            <div class="hero__tagline" aria-hidden="true">
              <span class="hero__tagline-text">UNFORGETTABLE</span>
            </div>
            <p class="hero__sub">PREMIUM DESIGN &amp; DEVELOPMENT STUDIO EST. 2024</p>
          </section>

          <!-- Section 2 — About -->
          <section class="section about" id="about" data-reveal>
            <div class="about__grid container">
              <div class="about__left anim-reveal">
                <h2 id="about-title"></h2>
                <div class="about__image">
                  <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=600&q=80" alt="Modern design workspace" loading="lazy" />
                </div>
              </div>
              <div class="about__right anim-reveal">
                <p id="about-text-1"></p>
                <p id="about-text-2"></p>
                <div class="about__image about__image--secondary">
                  <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=600&q=80" alt="Team collaboration" loading="lazy" />
                </div>
              </div>
            </div>
          </section>

          <!-- Section 3 — Portfolio Bento Grid -->
          <section class="section portfolio" id="proof" data-reveal>
            <div class="container">
              <div class="section-heading">
                <p class="eyebrow" id="portfolio-eyebrow">Portfolio</p>
                <h2 id="portfolio-title">Projects that prove the point.</h2>
              </div>
              <div class="bento-grid" id="portfolio-grid"></div>
            </div>
          </section>

          <!-- Section 5 — Kinetic Typography -->
          <section class="section kinetic-type" id="kinetic" data-reveal>
            <div class="kinetic-type__bg" aria-hidden="true"></div>
            <p class="kinetic-type__intro" id="kinetic-intro"></p>
            <div class="kinetic-type__text">
              <span class="kinetic-line" data-speed="1.2">14+ PROJECTS</span>
              <span class="kinetic-line" data-speed="0.8">AND COUNTING</span>
            </div>
          </section>

          <!-- Section 6 — Stats -->
          <section class="section stats" id="stats" data-reveal>
            <div class="stats__grid container">
              <div class="stats__big">
                <span class="stats__number" data-count-to="14" data-count-suffix="+">0</span>
                <span class="stats__label" id="stats-label"></span>
              </div>
              <div class="stats__text">
                <span class="stats__word" data-speed="1.1">MADE FOR</span>
                <span class="stats__word" data-speed="0.9">IMPACT</span>
              </div>
            </div>
          </section>

          <!-- Section 7 — Description / Why Us -->
          <section class="section differentiation" id="why" data-reveal>
            <div class="container">
              <div class="section-heading">
                <p class="eyebrow" id="why-eyebrow"></p>
                <h2 id="why-title"></h2>
              </div>
              <div class="pillars" id="pillars-grid" data-reveal-stagger></div>
            </div>
          </section>

          <!-- Section 8 — Services Horizontal Scroll -->
          <section class="section services-morph" id="services" data-reveal>
            <div class="container">
              <div class="section-heading">
                <p class="eyebrow" id="services-eyebrow"></p>
                <h2 id="services-title"></h2>
              </div>
            </div>
            <div class="services-morph__track" id="services-track"></div>
            <div class="services-morph__shape" aria-hidden="true">
              <svg id="morph-svg" viewBox="0 0 400 400">
                <circle id="morph-shape" cx="200" cy="200" r="150" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15" />
              </svg>
            </div>
          </section>

          <!-- Section 9 — FAQ / Objections -->
          <section class="section objections" id="faq" data-reveal>
            <div class="container">
              <div class="section-heading">
                <p class="eyebrow" id="faq-eyebrow"></p>
                <h2 id="faq-title"></h2>
              </div>
              <div class="accordion" id="faq-accordion"></div>
              <div class="comparison-table" id="comparison-table"></div>
            </div>
          </section>

          <!-- Section 10 — Process Timeline -->
          <section class="section" id="process" data-reveal>
            <div class="container">
              <div class="section-heading">
                <p class="eyebrow" id="process-eyebrow"></p>
                <h2 id="process-title"></h2>
              </div>
              <div class="timeline" id="timeline"></div>
            </div>
          </section>

          <!-- Section 11 — Marquee Ticker -->
          <section class="marquee-section" data-reveal>
            <div class="marquee__track" id="marquee-track"></div>
          </section>

          <!-- Section 12 — Contact CTA -->
          <section class="section cta-section" id="contact" data-reveal>
            <div class="cta-section__bg" aria-hidden="true"></div>
            <div class="cta-section__grid container">
              <div class="cta-section__copy">
                <p class="eyebrow" id="cta-eyebrow"></p>
                <h2 id="cta-title"></h2>
                <p id="cta-text"></p>
                <p class="scarcity-badge" id="cta-scarcity"></p>
              </div>
              <form class="audit-form" id="audit-form" method="POST" action="/api/contact" novalidate>
                <label class="field">
                  <span id="form-label-name">Name</span>
                  <input type="text" name="name" id="audit-name" required autocomplete="name" />
                </label>
                <label class="field">
                  <span id="form-label-email">Email</span>
                  <input type="email" name="email" id="audit-email" required autocomplete="email" />
                </label>
                <label class="field">
                  <span id="form-label-url">Website URL</span>
                  <input type="url" name="url" id="audit-url" autocomplete="url" />
                </label>
                <label class="field">
                  <span id="form-label-message">Message</span>
                  <textarea name="message" id="audit-message" rows="4"></textarea>
                </label>
                <!-- Honeypot anti-spam field -->
                <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true" />
                <button class="button button--primary" type="submit" id="audit-submit"></button>
                <p class="form-consent" id="form-consent">By submitting this form, you agree to our <a href="/privacy">privacy policy</a>.</p>
                <div class="form-status" id="form-status" role="alert" aria-live="polite"></div>
              </form>
            </div>
            <p class="trust-line" id="audit-trust"></p>
          </section>
        </main>

        <!-- Footer — inside smooth-content, after main -->
        <footer class="site-footer">
          <div class="container site-footer__grid">
            <div>
              <a class="brand brand--footer" href="#top" aria-label="Back to top">
                <img class="brand__logo" src="/logo4.svg" alt="IPDESIGN" />
              </a>
              <p class="site-footer__summary" id="footer-summary"></p>
            </div>
            <div>
              <p class="footer-title" id="footer-links-title"></p>
              <a href="#services" id="footer-link-services"></a>
              <a href="#why" id="footer-link-why"></a>
              <a href="#proof" id="footer-link-proof"></a>
            </div>
            <div>
              <p class="footer-title" id="footer-contact-title"></p>
              <a href="#contact" id="footer-contact-primary"></a>
              <a href="#process" id="footer-contact-secondary"></a>
              <a class="footer-contact-link" href="mailto:hello@ipdesign.co.uk" id="footer-email"></a>
              <span id="footer-location"></span>
              <a class="footer-contact-link" href="/privacy" id="footer-privacy">Privacy Policy</a>
            </div>
          </div>
        </footer>
      </div>
    </div>

    <!-- GSAP + plugins -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js" integrity="sha384-xNHNOfrykny9oFwnmpfNbkSc6isny38d1GZvTRVuFV0l9fTMIZKhULvomyQJSMRl" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/SplitText.min.js" integrity="sha384-iJQU/7haAHHrfeX4o0uooRF7Po6K7IhD+YU5dustu1NfalmSBYI7pbX6wAtx2f9j" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/Observer.min.js" integrity="sha384-Nf4tvs1oAfs/HlygkgZSXZANpx22foU4HTu5Dy2avgK7QUkg5OTtt35nsMkT5sVC" crossorigin="anonymous"></script>

    <!-- App -->
    <script src="app.js"></script>
  </body>
</html>
