<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPDESIGN</title>
    <meta name="description" content="IPDESIGN preview site" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header" data-reveal>
        <div class="container site-header__inner">
          <a class="brand" href="#top" aria-label="IPDESIGN home">
            <span class="brand__mark"></span>
            <span class="brand__text" id="brand-text">IPDESIGN</span>
          </a>
          <nav class="site-nav" aria-label="Primary">
            <a href="#services" id="nav-services">Services</a>
            <a href="#why" id="nav-why">Why IPDESIGN</a>
            <a href="#portal" id="nav-portal">Portal Preview</a>
            <a href="#ventures" id="nav-ventures">Ventures</a>
          </nav>
          <a class="button button--ghost button--compact" href="#contact" id="header-cta">Talk to IPDESIGN</a>
        </div>
      </header>

      <main>
        <section class="hero section section--flush" id="top">
          <div class="hero__backdrop" aria-hidden="true">
            <div class="hero__gradient hero__gradient--one"></div>
            <div class="hero__gradient hero__gradient--two"></div>
            <div class="hero__grid"></div>
            <div class="hero__network">
              <span class="network-line network-line--one"></span>
              <span class="network-line network-line--two"></span>
              <span class="network-line network-line--three"></span>
              <span class="network-node network-node--one"></span>
              <span class="network-node network-node--two"></span>
              <span class="network-node network-node--three"></span>
              <span class="network-node network-node--four"></span>
            </div>
          </div>

          <div class="container hero__layout">
            <div class="hero__content" data-reveal data-delay="0">
              <p class="eyebrow" id="hero-eyebrow"></p>
              <h1 class="hero-title" id="hero-title"></h1>
              <p class="hero__lead" id="hero-lead"></p>
              <div class="hero__actions">
                <a class="button" href="#contact" id="hero-primary-cta"></a>
                <a class="button button--ghost" href="#contact" id="hero-secondary-cta"></a>
              </div>
              <ul class="hero__signals" aria-label="Capabilities" id="hero-signals"></ul>
            </div>

            <div class="hero__panel interactive-card" data-reveal data-delay="140">
              <div class="panel panel--hero">
                <div class="panel__header">
                  <div>
                    <p class="panel__eyebrow" id="hero-panel-eyebrow"></p>
                    <h2 id="hero-panel-title"></h2>
                  </div>
                  <span class="status-pill" id="hero-panel-status"></span>
                </div>
                <div class="hero-stack">
                  <article class="hero-stack__card hero-stack__card--primary">
                    <div class="hero-stack__heading">
                      <span id="hero-card-primary-title"></span>
                      <span id="hero-card-primary-meta"></span>
                    </div>
                    <p id="hero-card-primary-text"></p>
                  </article>
                  <article class="hero-stack__card">
                    <div class="hero-stack__heading">
                      <span id="hero-card-secondary-title"></span>
                      <span id="hero-card-secondary-meta"></span>
                    </div>
                    <div class="hero-tags" id="hero-card-tags"></div>
                  </article>
                  <article class="hero-stack__card hero-stack__card--row">
                    <div>
                      <p class="mini-label" id="hero-card-tertiary-label"></p>
                      <strong id="hero-card-tertiary-title"></strong>
                    </div>
                    <div class="signal-bars" aria-hidden="true">
                      <span></span>
                      <span></span>
                      <span></span>
                      <span></span>
                    </div>
                  </article>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="section trust-band" data-reveal>
          <div class="container trust-band__inner">
            <p id="trust-band-text"></p>
            <div class="trust-band__items" id="trust-band-items"></div>
          </div>
        </section>

        <section class="showcase-strip" data-reveal>
          <div class="container showcase-strip__inner">
            <p class="eyebrow" id="showcase-eyebrow"></p>
            <div class="showcase-marquee">
              <div class="showcase-marquee__track" id="showcase-marquee"></div>
            </div>
          </div>
        </section>

        <section class="section editorial-break">
          <div class="container editorial-break__layout">
            <p class="eyebrow" id="manifesto-eyebrow" data-reveal></p>
            <h2 class="editorial-break__title" id="manifesto-title" data-reveal data-delay="60"></h2>
            <div class="editorial-break__support" data-reveal data-delay="120">
              <p id="manifesto-text"></p>
              <a class="text-link editorial-break__link" href="#services" id="manifesto-link"></a>
            </div>
          </div>
        </section>

        <section class="section" id="services">
          <div class="container section-shell section-shell--services">
            <div class="section-heading section-heading--sticky section-heading--rail" data-reveal>
              <p class="eyebrow" id="services-eyebrow"></p>
              <h2 id="services-title"></h2>
              <p id="services-text"></p>
            </div>
            <div class="services-grid" id="services-grid"></div>
          </div>
        </section>

        <section class="section" id="why">
          <div class="container why-layout">
            <div class="why-copy" data-reveal>
              <p class="eyebrow" id="why-eyebrow"></p>
              <h2 id="why-title"></h2>
              <p id="why-text"></p>
            </div>
            <div class="why-panels" data-reveal data-delay="120" id="why-panels"></div>
          </div>
        </section>

        <section class="section">
          <div class="container operations-layout">
            <div class="operations-intro" data-reveal>
              <div class="section-heading section-heading--tight">
                <p class="eyebrow" id="industries-eyebrow"></p>
                <h2 id="industries-title"></h2>
              </div>
              <div class="industries-cloud" id="industries-cloud"></div>
            </div>

            <div class="operations-process" data-reveal data-delay="120">
              <div class="section-heading section-heading--tight">
                <p class="eyebrow" id="process-eyebrow"></p>
                <h2 id="process-title"></h2>
              </div>
              <div class="process-list" id="process-list"></div>
            </div>
          </div>
        </section>

        <section class="section" id="portal">
          <div class="container portal-layout">
            <div class="section-heading section-heading--sticky" data-reveal>
              <p class="eyebrow" id="portal-eyebrow"></p>
              <h2 id="portal-title"></h2>
              <p id="portal-text"></p>
            </div>

            <div class="portal-preview panel interactive-card" data-reveal data-delay="140">
              <div class="portal-preview__topbar">
                <div class="portal-preview__title">
                  <p class="panel__eyebrow" id="portal-panel-eyebrow"></p>
                  <h3 id="portal-panel-title"></h3>
                </div>
                <div class="portal-preview__filters" id="portal-filters"></div>
              </div>

              <div class="portal-preview__body">
                <div class="portal-list">
                  <div class="portal-list__header">
                    <span id="portal-header-request"></span>
                    <span id="portal-header-status"></span>
                    <span id="portal-header-priority"></span>
                  </div>
                  <div class="portal-list__items" id="portal-list"></div>
                </div>

                <aside class="portal-detail" id="portal-detail" aria-live="polite"></aside>
              </div>
            </div>
          </div>
        </section>

        <section class="section" id="ventures">
          <div class="container section-shell section-shell--ventures">
            <div class="section-heading section-heading--sticky section-heading--rail" data-reveal>
              <p class="eyebrow" id="ventures-eyebrow"></p>
              <h2 id="ventures-title"></h2>
              <p id="ventures-text"></p>
            </div>
            <div class="ventures-grid" id="ventures-grid"></div>
          </div>
        </section>

        <section class="section section--cta" id="contact">
          <div class="container">
            <div class="cta-block panel interactive-card" data-reveal>
              <div>
                <p class="eyebrow" id="cta-eyebrow"></p>
                <h2 id="cta-title"></h2>
                <p id="cta-text"></p>
              </div>
              <div class="cta-block__actions">
                <a class="button" href="mailto:hello@ipdesign.example" id="cta-primary"></a>
                <a class="button button--ghost" href="https://wa.me/0000000000" id="cta-secondary"></a>
                <a class="text-link" href="mailto:hello@ipdesign.example" id="cta-contact-link"></a>
              </div>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container site-footer__grid">
          <div>
            <a class="brand brand--footer" href="#top">
              <span class="brand__mark"></span>
              <span class="brand__text" id="footer-brand-text">IPDESIGN</span>
            </a>
            <p class="site-footer__summary" id="footer-summary"></p>
          </div>
          <div>
            <p class="footer-title" id="footer-links-title"></p>
            <a href="#services" id="footer-link-services"></a>
            <a href="#portal" id="footer-link-portal"></a>
            <a href="#ventures" id="footer-link-ventures"></a>
          </div>
          <div>
            <p class="footer-title" id="footer-contact-title"></p>
            <a href="mailto:hello@ipdesign.example" id="footer-email"></a>
            <a href="https://wa.me/0000000000" id="footer-whatsapp"></a>
            <span id="footer-location"></span>
          </div>
        </div>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
