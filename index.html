<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPDESIGN | Affordable Custom Websites for UK Businesses</title>
    <meta
      name="description"
      content="Premium websites, landing pages, AI solutions and custom platforms for UK small businesses. Professional quality from £1,500. Get a free quote today."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/logo4.svg" />
    <link rel="apple-touch-icon" href="/logo4.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header" data-reveal>
        <div class="container site-header__inner">
          <a class="brand" href="#top" aria-label="IPDESIGN Home">
            <img class="brand__logo" src="/logo4.svg" alt="" />
          </a>
          <nav class="site-nav" aria-label="Main navigation">
            <a href="#services" id="nav-services">Services</a>
            <a href="#why" id="nav-why">Why Us</a>
            <a href="#proof" id="nav-proof">Portfolio</a>
            <a href="#process" id="nav-process">Process</a>
            <a href="/dashboard" id="nav-dashboard">Dashboard Demo</a>
          </nav>
          <a class="header-phone" href="tel:+4402000000000" id="header-phone">+44 (0) 20 XXXX XXXX</a>
          <a class="button button--ghost button--compact" href="#contact" id="header-cta">Get a Quote</a>
          <button class="lang-toggle" type="button" id="lang-toggle" aria-label="Switch language">FR</button>
        </div>
      </header>

      <main>
        <!-- Section 1 — Hero -->
        <section class="hero section section--flush" id="top" data-reveal>
          <div class="hero__backdrop" aria-hidden="true">
            <div class="hero__gradient hero__gradient--one"></div>
            <div class="hero__gradient hero__gradient--two"></div>
            <div class="hero__grid"></div>
            <div class="hero__sequence" aria-hidden="true">
              <canvas class="hero__sequence-canvas" width="1280" height="720"></canvas>
            </div>
          </div>

          <div class="container hero__layout">
            <div class="hero__content" data-reveal data-delay="0">
              <p class="eyebrow" id="hero-eyebrow"></p>
              <h1 class="hero-title" id="hero-title"></h1>
              <p class="hero__lead" id="hero-lead"></p>
              <div class="hero-ctas">
                <a class="button button--primary" href="#contact" id="hero-primary-cta"></a>
                <a class="button button--ghost" href="#services" id="hero-ghost-cta"></a>
              </div>
              <div class="trust-bar" id="trust-bar"></div>
            </div>
          </div>
        </section>

        <!-- Section 2 — Problem / Agitation -->
        <section class="section problem" id="problem" data-reveal>
          <div class="container">
            <div class="problem__grid">
              <div class="problem__copy">
                <p class="eyebrow" id="problem-eyebrow"></p>
                <h2 id="problem-title"></h2>
              </div>
              <div class="problem__cards" id="problem-cards"></div>
            </div>
            <blockquote class="manifesto" id="manifesto-quote"></blockquote>
          </div>
        </section>

        <!-- Section 3 — Solution Reveal / Differentiation -->
        <section class="section differentiation" id="why" data-reveal>
          <div class="container">
            <div class="section-heading section-heading--center">
              <p class="eyebrow" id="why-eyebrow"></p>
              <h2 id="why-title"></h2>
            </div>
            <div class="pillars" id="pillars-grid"></div>
          </div>
        </section>

        <!-- Section 4 — Services Grid -->
        <section class="section" id="services" data-reveal>
          <div class="container">
            <div class="section-heading section-heading--center">
              <p class="eyebrow" id="services-eyebrow"></p>
              <h2 id="services-title"></h2>
            </div>
            <div class="services-grid" id="services-grid"></div>
          </div>
        </section>

        <!-- Section 5 — Social Proof / Portfolio -->
        <section class="section proof" id="proof" data-reveal>
          <div class="container">
            <div class="proof__grid">
              <div class="proof__stats" id="proof-stats"></div>
              <div class="proof__portfolio" id="proof-portfolio"></div>
            </div>
            <div class="proof__wordcloud" id="proof-wordcloud"></div>
          </div>
        </section>

        <!-- Section 6 — Objection Crusher -->
        <section class="section objections" id="faq" data-reveal>
          <div class="container">
            <div class="section-heading section-heading--center">
              <p class="eyebrow" id="faq-eyebrow"></p>
              <h2 id="faq-title"></h2>
            </div>
            <div class="accordion" id="faq-accordion"></div>
            <div class="comparison-table" id="comparison-table"></div>
          </div>
        </section>

        <!-- Section 7 — Process Timeline -->
        <section class="section" id="process" data-reveal>
          <div class="container">
            <div class="section-heading section-heading--center">
              <p class="eyebrow" id="process-eyebrow"></p>
              <h2 id="process-title"></h2>
            </div>
            <div class="timeline" id="timeline"></div>
          </div>
        </section>

        <!-- Section 8 — Final CTA / Free Audit Form -->
        <section class="section section--cta cta-section" id="contact" data-reveal>
          <div class="container">
            <div class="cta-section__grid">
              <div class="cta-section__copy">
                <p class="eyebrow" id="cta-eyebrow"></p>
                <h2 id="cta-title"></h2>
                <p id="cta-text"></p>
                <div class="scarcity-badge" id="cta-scarcity"></div>
              </div>
              <form class="audit-form" id="audit-form">
                <label class="field">
                  <span id="form-label-name">Name</span>
                  <input type="text" name="name" id="audit-name" required />
                </label>
                <label class="field">
                  <span id="form-label-email">Email</span>
                  <input type="email" name="email" id="audit-email" required />
                </label>
                <label class="field">
                  <span id="form-label-url">Website URL</span>
                  <input type="url" name="url" id="audit-url" />
                </label>
                <label class="field">
                  <span id="form-label-message">Message</span>
                  <textarea name="message" id="audit-message" rows="4"></textarea>
                </label>
                <button class="button button--primary" type="submit" id="audit-submit"></button>
              </form>
            </div>
            <p class="cta-section__trust" id="cta-trust"></p>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container site-footer__grid">
          <div>
            <a class="brand brand--footer" href="#top" aria-label="Back to top">
              <img class="brand__logo" src="/logo4.svg" alt="" />
            </a>
            <p class="site-footer__summary" id="footer-summary"></p>
          </div>
          <div>
            <p class="footer-title" id="footer-links-title"></p>
            <a href="#services" id="footer-link-services"></a>
            <a href="#why" id="footer-link-why"></a>
            <a href="#proof" id="footer-link-proof"></a>
          </div>
          <div>
            <p class="footer-title" id="footer-contact-title"></p>
            <a href="#contact" id="footer-contact-primary"></a>
            <a href="#process" id="footer-contact-secondary"></a>
            <a class="footer-contact-link" href="tel:+4402000000000" id="footer-phone"></a>
            <a class="footer-contact-link" href="mailto:hello@ipdesign.co.uk" id="footer-email"></a>
            <span id="footer-location"></span>
          </div>
        </div>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
